{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Video - Portal Astrológico</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Portal Astrológico</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'video_upload' %}">Subir Video</a>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Subir Nuevo Video</h2>
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="titulo" class="form-label">Título</label>
                                <input type="text" class="form-control" id="titulo" name="titulo" required>
                            </div>
                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción</label>
                                <textarea class="form-control" id="descripcion" name="descripcion" rows="3" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="url_youtube" class="form-label">URL de YouTube</label>
                                <input type="url" class="form-control" id="url_youtube" name="url_youtube" 
                                       placeholder="https://www.youtube.com/watch?v=..." required>
                                <small class="form-text text-muted">
                                    Ejemplo: https://www.youtube.com/watch?v=XXXXXXXXXXX o https://youtu.be/XXXXXXXXXXX
                                </small>
                            </div>
                            <div class="text-center">
                                <button type="submit" class="btn btn-primary">Subir Video</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container text-center">
            <p>&copy; 2024 Portal Astrológico. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        :root {
            --color-primary: #e3f2fd;
            --color-secondary: #90caf9;
            --color-accent: #42a5f5;
            --color-text: #424242;
            --color-background: #fafafa;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background: linear-gradient(135deg, var(--color-background), var(--color-primary));
            color: var(--color-text);
            min-height: 100vh;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .footer {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2rem 0;
            margin-top: 3rem;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        .card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            margin-bottom: 5rem;
        }

        .card-title {
            color: var(--color-accent);
            font-weight: 600;
        }

        .form-label {
            color: var(--color-text);
            font-weight: 500;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--color-text);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--color-accent);
            box-shadow: 0 0 0 0.2rem rgba(66, 165, 245, 0.25);
        }

        .btn-primary {
            background-color: var(--color-accent);
            border-color: var(--color-accent);
            padding: 0.5rem 2rem;
        }

        .btn-primary:hover {
            background-color: var(--color-secondary);
            border-color: var(--color-secondary);
        }

        .navbar-brand {
            font-size: 1.5rem;
            color: var(--color-accent);
            font-weight: 600;
        }

        .nav-link {
            color: var(--color-text);
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: var(--color-accent);
        }
    </style>
</body>
</html>
